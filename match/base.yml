matches:
  # 문제를 작은 단위로 분해하고 해결 순서를 정리
  - trigger: ":문제분해"
    replace: >-
      문제를 근본적인 관점에서 분석하고, 실제 해결에 도움이 되는 단위의 하위 문제로 분해해줘.
      각 하위 문제의 원인, 의존관계, 영향도를 파악하고 해결 우선순위를 정해줘.
      어떤 순서로 접근해야 전체 문제를 가장 효과적으로 해결할 수 있는지도 제안해줘.
      불필요하게 세분화하거나 아직 확인되지 않은 원인을 사실처럼 단정하지 마.

  # 계획·설계와 실제 구현의 일치 여부 검증
  - trigger: ";결과검증"
    replace: >-
      계획·설계 문서와 실제 구현 코드를 비교하여 요구사항이 계획대로 구현되었는지 항목별로 검증해줘.
      각 요구사항마다 관련 코드와 근거를 확인하고 `일치 / 부분 일치 / 불일치 / 미구현 / 판단 불가`로 판정해줘.
      설계와 다른 구현, 누락된 기능, 계획에 없던 추가 동작, 주요 문제점을 구체적으로 식별해줘.
      가능한 경우 파일명, 클래스명, 함수명 등 확인 가능한 코드 근거를 함께 제시해줘.
      직접 확인할 수 없는 내용은 추측하지 말고 `판단 불가` 또는 `확인 필요`로 표시해줘.
      마지막에는 요구사항 충족 상태, 주요 문제점, 수정 우선순위를 요약해줘.

  # 숨어 있는 세부 문제를 최대한 많이 발견
  - trigger: ";디테일"
    replace: >-
      기능, 설계, 구현 결과를 세밀하게 다시 검토해줘.
      명백한 버그뿐 아니라 평소에는 잘 드러나지 않는 미묘한 문제, 예외 상황, 경계 조건,
      불편한 사용자 경험, 일관성이 깨지는 부분, 오해하기 쉬운 동작, 잠재적인 오류 가능성까지 폭넓게 찾아줘.
      이번 검토에서는 개선안을 만드는 것보다 실제 문제와 위험 요소를 최대한 빠짐없이 발견하는 데 집중해줘.
      확인되지 않은 문제를 사실처럼 단정하지 말고, 근거가 부족하면 `확인 필요`로 구분해줘.

  # 현재 목표·진행 상황·성과 정리
  - trigger: ":목표성과"
    replace: >-
      이번 세션에서 달성하려는 최종 목표와 성공 조건을 먼저 명확히 정리해줘.
      구현하려는 기능이나 시스템이 무엇인지 설명하고, 현재까지 완료된 것과 아직 남아 있는 것을 구분해줘.
      현재 성과가 목표 달성에 얼마나 기여했는지 확인하고, 남은 핵심 작업을 정리해줘.
      마지막으로 구현이 완료되었을 때 기대되는 결과와 효과를 구체적으로 설명해줘.

  # 증상과 근본 원인을 구분하여 진단
  - trigger: ";원인파악"
    replace: >-
      해당 이슈의 핵심 쟁점과 정상적으로 동작했을 때의 기대 상태를 먼저 정리해줘.
      증상과 근본 원인을 구분하고, 가능한 원인들을 가설로 세운 뒤 로그, 코드, 테스트 결과,
      재현 결과 등 확인 가능한 근거를 통해 하나씩 검증해줘.
      검증된 근본 원인을 기준으로 해결 방향을 도출해줘.
      증거가 부족해 원인을 확정할 수 없다면 추측해서 단정하지 말고,
      현재 확인된 사실과 추가로 확인해야 할 항목을 명확히 구분해줘.

  # 문제 발견부터 해결·검증까지 전체 과정 수행
  - trigger: ";문제해결"
    replace: >-
      선입견이나 기존 가정에 얽매이지 말고 문제를 객관적으로 분석하고 해결해줘.
      먼저 정상 상태와 현재 증상을 비교하고, 가능하면 문제를 재현해줘.
      로그, 코드, 테스트 결과, 실행 결과를 우선 확인하고 필요한 경우 공식 문서와 신뢰할 수 있는 최신 자료를 참고해줘.
      문제를 해결 가능한 단위로 분해한 뒤 증상과 근본 원인을 구분하고, 가능한 원인들을 근거로 검증해줘.
      여러 해결책이 있다면 장단점과 영향 범위를 비교하여 가장 단순하면서 효과적인 근본 해결책을 선택해줘.
      실행 가능한 조치는 영향 범위를 확인한 후 순차적으로 적용하고, 각 단계가 실제 문제를 해결했는지 다시 검증해줘.
      해결할 수 없거나 근거가 부족한 부분은 추측하지 말고 확인된 사실, 남은 문제, 추가 확인 사항을 명확히 보고해줘.

  # 전체 결과를 제한하는 핵심 병목 식별
  - trigger: ";병목파악"
    replace: >-
      현재 작업이나 시스템의 전체 흐름을 먼저 파악하고, 전체 성능이나 진행 속도를 가장 크게 제한하는 핵심 병목을 찾아줘.
      단순히 느리거나 눈에 띄는 부분을 병목으로 단정하지 말고 앞뒤 단계와 의존관계를 함께 확인해줘.
      가능한 경우 각 단계의 처리시간, 대기시간, 작업량, 자원 사용량, 오류와 재시도,
      외부 의존성, 동시 처리 가능 여부 등을 비교해줘.
      병목 후보별로 해당 단계가 전체 결과를 실제로 얼마나 제한하는지 검증하고,
      병목의 증상과 근본 원인을 구분해줘.
      결과는 `전체 흐름 → 병목 후보 → 판단 근거 → 핵심 병목 → 근본 원인 → 전체 영향 → 해결 우선순위` 순서로 정리해줘.
      측정하거나 확인할 수 없는 부분은 추측하지 말고 `확인 필요`로 표시해줘.
      마지막에는 가장 먼저 해결했을 때 전체 결과 개선 효과가 가장 큰 핵심 병목을 명확히 정리해줘.

  # 종류에 관계없이 결과물 전체를 독립적으로 재검토
  - trigger: ":적대적리뷰"
    replace: >-
      현재 결과물을 독립적인 검토자의 관점에서 적대적으로 리뷰해줘.
      여기서 적대적 리뷰의 목적은 흠집을 잡는 것이 아니라 실제 실패 가능성, 누락된 요구사항,
      잘못된 가정, 논리적 모순, 설계 결함, 운영상 위험을 사전에 발견하여 결과물의 완성도를 높이는 것이다.
      단순한 취향 차이와 실제 발생 가능성이 낮은 과도한 지적은 제외하고,
      목표 달성이나 실제 운영에 영향을 줄 가능성이 있는 문제를 우선적으로 찾아줘.
      각 문제는 `문제점 → 발생 조건 → 예상 영향 → 근거 → 심각도 → 개선안` 순서로 정리해줘.
      확인되지 않은 위험은 확정된 문제와 구분해줘.
      마지막에는 `반드시 수정해야 할 항목`과 `개선을 권장하는 항목`을 구분하고,
      현재 상태로 다음 단계로 진행해도 되는지 근거와 함께 판단해줘.

  # 구현 코드 자체의 결함 검토
  - trigger: ";코드리뷰"
    replace: >-
      구현된 코드를 대상으로 적대적 코드 리뷰를 진행해줘.
      단순한 코드 스타일이나 개인 취향보다 배포 후 실제 장애, 보안 문제, 데이터 오류,
      성능 저하, 유지보수 문제로 이어질 가능성이 있는 결함을 우선적으로 찾아줘.
      핵심 로직 오류, 예외 처리 누락, 경계 조건, 동시성 문제, 데이터 정합성,
      보안 취약점, 성능 병목, 트랜잭션 처리, 외부 API 장애 대응, 리소스 누수,
      테스트 누락 등을 검토해줘.
      실제 문제가 될 가능성이 낮은 과도한 방어 코드나 단순한 스타일 차이는 제외해줘.
      각 문제는 `코드 위치 → 문제점 → 발생 조건 → 예상 영향 → 근거 → 심각도 → 수정 방향` 순서로 정리해줘.
      가능한 경우 파일명, 클래스명, 함수명 등 구체적인 코드 위치를 제시하고,
      직접 확인할 수 없는 내용은 추측하지 말고 `확인 필요`로 표시해줘.
      마지막에는 반드시 수정해야 할 문제부터 우선순위대로 요약해줘.

  # 실제 사용자의 관점에서 동작 검증
  - trigger: ";QA"
    replace: >-
      현재 구현된 기능을 실제 사용자의 관점에서 QA(Quality Assurance, 품질 검증)해줘.
      요구사항에 맞게 동작하는지 확인하고 정상 흐름뿐 아니라 잘못된 입력, 빈 값, 최대·최소값,
      빠른 반복 조작, 새로고침, 뒤로가기, 중복 요청, 네트워크 오류, 권한 차이,
      데이터가 없는 상황 등 다양한 경계 조건을 검증해줘.
      각 기능의 `입력 → 처리 → 상태 변화 → 저장 → 조회 → 수정 → 삭제 → 오류 처리` 흐름과
      기능 간 연결 과정도 확인해줘.
      UI가 있다면 버튼, 폼, 모달, 로딩 상태, 오류 메시지, 비활성 상태,
      반응형 화면, 키보드 조작 등 실제 사용자 흐름도 검증해줘.
      변경을 수반하는 테스트는 확인된 테스트 환경과 테스트 데이터로 수행해줘.
      실제 데이터 수정·삭제, 주문·결제, 외부 발송이 필요한 경우에는 실행 전에 확인받아.
      실행 가능한 테스트는 직접 실행하고, 실행하지 못한 테스트는 실제 결과를 만들어내지 말고 `확인 필요`로 표시해줘.
      이번 QA에서는 구현 코드를 수정하지 마.
      발견한 문제는 `검증 항목 → 테스트 조건/절차 → 기대 결과 → 실제 결과 → Pass/Fail/확인 필요 → 심각도` 순서로 정리해줘.
      이번 단계에서는 개선안을 만드는 것보다 실제 동작 여부 확인과 버그 발견에 집중해줘.

  # 구현 전 계획·설계 문서 전용 리뷰
  - trigger: ":설계리뷰"
    replace: >-
      계획과 설계 문서를 대상으로 구현 전 적대적 리뷰를 진행해줘.
      목적은 트집을 잡는 것이 아니라 구현 전에 핵심 기능 누락, 모호하거나 충돌하는 요구사항,
      잘못된 가정, 설계의 빈틈, 데이터 정합성 문제, 장애 대응 누락,
      보안·성능·운영·확장성 위험 등을 발견하여 설계의 완성도를 높이는 것이다.
      세부 표현이나 단순한 취향 차이보다 실제 구현 실패나 운영 장애로 이어질 가능성이 있는 문제를 우선적으로 검토해줘.
      각 문제는 `문제점 → 발생 조건 → 예상 영향 → 근거 → 심각도 → 개선안` 순서로 정리해줘.
      확인되지 않은 가정이나 정보가 있다면 별도로 표시해줘.
      마지막에는 `구현 전에 반드시 수정해야 할 항목`과 `개선을 권장하는 항목`을 구분하고,
      현재 설계를 기준으로 구현을 시작해도 되는지 근거와 함께 판단해줘.
  
  # 문제를 해결하기 전에 숨어 있는 문제와 위험 요소를 폭넓게 발견
  - trigger: ";문제발견"
    replace: >-
      현재 대상의 목표와 정상적으로 기대되는 상태를 먼저 파악한 뒤,
      실제 결과와 비교하여 문제, 결함, 누락, 불일치, 불편 요소, 잠재적 위험을 최대한 폭넓게 찾아줘.
      명백한 문제뿐 아니라 특정 조건에서만 발생하는 문제, 경계 조건, 예외 상황,
      사용자 흐름의 단절, 데이터 불일치, 잘못된 가정, 모호한 동작,
      기능 간 충돌, 운영 과정에서 발생할 수 있는 문제까지 살펴봐.
      눈에 띄는 현상만 나열하지 말고 실제로 문제가 될 가능성이 있는지를 근거와 함께 확인해줘.
      확정된 문제와 가능성이 있는 문제를 구분하고,
      직접 확인할 수 없는 내용은 추측하여 문제로 단정하지 말고 `확인 필요`로 표시해줘.
      이번 단계에서는 원인 분석이나 해결책 제시보다 문제를 빠짐없이 발견하고 명확하게 정의하는 데 집중해줘.
      결과는 `문제 → 발생 조건 → 관찰된 현상 또는 근거 → 예상 영향 → 확실성 → 심각도` 순서로 정리하고,
      마지막에는 우선적으로 원인 파악이 필요한 핵심 문제를 정리해줘.

  # 다양한 가능성을 자유롭게 탐색한 뒤 실현 가능한 아이디어로 좁히기
  - trigger: ":브레인스토밍"
    replace: >-
      현재 목표와 해결하려는 핵심 문제를 먼저 명확히 정리한 뒤 브레인스토밍을 진행해줘.
      처음부터 하나의 해결책에 고정하지 말고 서로 다른 관점과 접근법에서 가능한 아이디어를 폭넓게 제시해줘.
      기존 방식의 개선뿐 아니라 단순화, 자동화, 제거, 통합, 분리, 사용자 경험 개선,
      기술적 대안, 운영 방식 변경 등 다양한 방향을 검토해줘.
      비슷한 아이디어를 표현만 바꾸어 반복하지 말고 실질적으로 다른 선택지를 만들어줘.
      아이디어 발산 단계에서는 지나치게 일찍 가능성을 제한하지 않되,
      사실이나 기술적 제약이 필요한 부분을 임의로 가정하지 말고 `확인 필요`로 표시해줘.
      충분히 아이디어를 발산한 뒤 목표 기여도, 구현 난이도, 비용, 위험, 확장성,
      기존 시스템과의 적합성을 기준으로 유사한 아이디어를 묶고 현실적인 후보로 좁혀줘.
      마지막에는 유력한 2~3가지 접근법의 핵심 차이와 장단점을 비교하되,
      정보가 부족한 상태에서는 하나의 안을 성급하게 확정하지 말고 추가로 검증해야 할 사항을 정리해줘.
  - trigger: ":의도확인"
    replace: "네가 이해한 내 의도와 핵심 요구사항, 최종 목표를 쉬운 말로 설명해줘. 이번에는 이해한 내용과 꼭 필요한 확인 질문만 제시하고, 내가 확인하거나 수정하기 전에는 계획 변경이나 후속 작업을 진행하지 마."

  # 목표와 의도에 대한 이해를 확인한 뒤 승인 전 작업 중단
  - trigger: ":맥락파악"
    replace: |-
      /easy-summary 전체적으로 선택하기 전에 충분한 설명이 필요하다. 그리고 나의 결정과 나의 목표가 상충되지 않도록 결정해야 한다.
      나의 목표 및 의도를 이해하고 있나? 네가 이해한 내 의도와 핵심 요구사항, 최종 목표를 쉬운 말로 설명해줘. 이번에는 이해한 내용과 꼭 필요한 확인 질문만 제시하고, 내가 확인하거나 수정하기 전에는 계획 변경이나 후속 작업을 진행하지 마.
#  - trigger: ";"
#    replace: ""

  # 현재 세션과 다른 AI 도구에 최소 구현 범위의 독립 리뷰 요청
  - trigger: ":계획검토"
    replace: >-
      현재 대화 세션이 Claude Code이면 Codex에, Codex이면 Claude Code에 현재 계획의 독립적인 리뷰를 요청해줘.
      현재 세션과 같은 도구 안에서 역할만 바꾼 자체 리뷰를 외부 리뷰로 간주하지 마.
      현재 세션의 실행 도구를 확인할 수 없거나 상대 도구를 실행할 수 없다면 그 사실을 알리고, 전달용 리뷰 프롬프트를 제공해줘. 실제로 받지 않은 리뷰를 받은 것처럼 보고하지 마.
      외부 리뷰에는 원래 요청, 목표, 완료 기준과 관련 문서·기존 구현을 함께 전달해.
      목적은 기능을 늘리는 것이 아니라 목표를 제대로 달성하는 데 필요한 최소한의 충분한 구현 범위를 정하는 거야.
      먼저 목표와 완료 기준을 짧게 정리하고, 각 계획 항목을 빼면 어떤 요구사항이 충족되지 않는지 검토하도록 해줘.
      결과는 ‘유지할 핵심·누락된 필수사항·더 단순하게 바꿀 부분·제외하거나 미룰 부분’으로 구분하고, 각 판단의 근거와 목표에 미치는 영향을 설명하도록 해줘.
      막연한 확장성이나 미래 가능성만으로 기능·추상화를 추가하지 말고, 단순화를 이유로 필수적인 정확성·보안·오류 처리·검증을 빼지도 않도록 해줘.
      기존 구현의 재사용을 우선하고, 누락이나 문제에는 가장 작은 보완안과 검증 방법을 제시하도록 해줘.
      확인되지 않은 내용은 ‘확인 필요’로 표시하고, 문제가 없다면 억지로 지적을 만들지 않도록 해줘.
      리뷰 의견은 그대로 수용하지 말고 원래 요구사항과 근거에 비춰 타당성을 검토한 뒤, 채택·보류·미채택 의견과 이유, 권장 최소 구현 순서를 정리해줘.
      이번에는 리뷰와 판단만 진행하고 계획 파일이나 코드는 수정하지 마.
  # 작업 복귀 시 목표와 마지막 결정, 다음 행동 복원
  - trigger: ":나복귀"
    replace: >-
      다른 일을 하다가 돌아왔어. 현재 대화와 관련 인계·진행 문서, 접근 가능한 컴퓨터 기록을 참고해 작업 맥락을 복원해줘.
      목표, 마지막 결정과 이유, 확인된 결과, 멈춘 지점, 다음 행동 하나를 짧게 정리해줘.
      상태가 달라졌을 수 있는 부분은 필요한 원본에서 확인하고, 확인할 수 없는 내용은 구분해줘. 이번에는 현황만 설명해줘.

  # 여러 프로젝트에서 지금 집중할 작업 선택
  - trigger: ":전체우선"
    replace: >-
      최근 기록에서 확인되는 프로젝트들의 진행 문서와 현재 상태를 확인해 남은 핵심 작업을 모아줘.
      바로 진행 가능한 일, 사용자 결정이 필요한 일, 외부 응답을 기다리는 일을 구분해줘.
      필수 안전 조건과 선행 작업을 먼저 고려하고, 목표 기여도와 필요한 노력을 비교해 우선순위 상위 3개를 정해줘.
      그중 지금 집중할 일 하나와 이유, 시작 행동, 완료 증거를 제안해줘. 최근 자주 열었다는 이유만으로 중요도를 높이지 마.

  # 선택지를 실제 작업 결과와 제약으로 비교
  - trigger: ":선택결과"
    replace: >-
      지금 제시한 선택지를 내 목표와 기존 결정에 맞춰 설명해줘.
      각 안에서 실제로 가능해지는 것, 남는 제약, 추가 작업과 비용, 나중에 바꾸기 어려운 점을 비교해줘.
      현재 작업의 구체적인 사례 하나에 각 선택지를 적용해 결과 차이를 보여줘.
      목표와 충돌하거나 필수 요구사항이 빠지는 안을 짚고, 추천 하나와 그 추천이 달라지는 조건을 알려줘. 이번에는 선택을 돕는 설명만 해줘.

  # 요청한 후속 작업과 현재 완료 증거 대조
  - trigger: ":후속점검"
    replace: >-
      최근 작업 기록에서 요청하거나 약속한 후속 작업과 실제 완료 증거를 대조해줘.
      리뷰 지적 반영, 검증 결과 확인, 배포 후 동작 확인, 외부 요청 처리 결과 등 끝까지 이어지지 않은 항목을 찾아줘.
      기록에 없다는 이유만으로 미완료라고 단정하지 말고 현재 원본을 확인해줘.
      이미 완료됐거나 명시적으로 취소·보류한 일은 제외하고, 남은 항목마다 영향, 다음 행동, 완료 증거를 적어 중요도순으로 정리해줘.

  # 반복 요청을 기존 단축어와 스킬의 보완안으로 정리
  - trigger: ":반복정리"
    replace: >-
      최근 대화와 접근 가능한 컴퓨터 기록에서 내가 반복해서 요청하거나 설명을 다시 요구한 내용을 찾아줘.
      반복 원인이 맥락 누락, 설명 부족, 절차 누락 중 무엇인지 근거와 함께 판단해줘.
      기존 Espanso 단축어와 스킬을 확인하고 보완·통합할 항목을 최대 3개 제안해줘.
      각 제안에는 줄어드는 반복, 적용할 위치, 바로 사용할 최종 문구를 포함해줘.
      한 번만 등장한 요청은 일반화하지 말고, 이번에는 분석과 제안만 해줘.

  # 병렬 PDCA 사이클의 실제 진행 상태를 대조하고 최신화
  - trigger: ":pdca현황"
    replace: |-
      /bkit:pdca status 로 PDCA 현황을 보여줘. 단, 상태 파일(.bkit/state/pdca-status.json)에 기록된 내용만 믿지 마라.
      상태 파일에 기록된 PDCA 외에도 여러 PDCA를 다른 브랜치·워크트리·세션에서 병행하고 있어서, 기록이 실제 진행보다 늦거나 빠져 있을 수 있다.
      
      1. 실제 상태 확인
        - git fetch 후 git worktree list, 로컬·원격 브랜치의 최근 커밋, 열린 PR과 최근 병합된 PR(gh pr list)을 확인하라.
        - 각 워크트리와 사이클 브랜치에 있는 docs/01-plan, docs/02-design 문서, 그 브랜치의 pdca-status.json, docs/05-handoff 최신 인계 메모를 대조하라.
        - 이렇게 해서 지금 진행 중인 PDCA 사이클을 빠짐없이 찾아라. develop에 아직 병합되지 않은 사이클 브랜치도 포함한다.
        - 이미 보관(archive)된 사이클과, 상태 파일에 기록만 남고 실제로는 멈춘 오래된 사이클은 구분해서 표시하라.
      
      2. 상태 최신화
        - 찾은 사이클마다 단계(phase), 진행 중인 모듈(scope), 브랜치, 진행 내용을 develop의 상태 파일에 실제 상태대로 반영하라(브랜치 → PR → 병합).
        - 반영한 뒤 /bkit:pdca status를 다시 실행해, 내가 기록한 단계가 그대로 보이는지 확인하라.
      
      3. 사이클별 설명과 진행률
        - 사이클마다 무엇을 하는지 한두 줄로 설명하라.
        - 진행률은 단계만 말하지 말고 세부 구현 진행률로 알려줘. Do 단계도 Design 문서의 모듈/슬라이스(작업 단위) 표로 쪼개져 있으니, 모듈마다 완료·진행 중·남음을 커밋·PR 근거와 함께 표시하라.
        - 진행률을 어떤 기준으로 계산했는지도 밝혀라.
      
      4. 우선순위와 진행 순서
        - 사이클 사이의 의존 관계(어느 결과가 먼저 필요한지), 같은 코드를 동시에 고쳐 충돌할 위험, 사용자 결정을 기다리는 항목, 이미 내린 사용자 결정을 근거로 우선순위를 정하라.
        - 그 근거와 함께 진행 순서를 안내하라. 사이클끼리 방향이 엇갈리는 지점이 있으면 따로 짚어줘.
